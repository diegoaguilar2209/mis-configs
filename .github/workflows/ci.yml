name: ci
on:
  push:
  pull_request:

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks scans the whole history
      - name: Lint shell scripts
        run: sudo apt-get install -y -qq shellcheck && shellcheck install.sh bin/* shell/init.bash scripts/*.sh scripts/git-hooks/*
      - name: Install on a clean machine
        run: ./install.sh --yes
      - name: No secrets in the repo (gitleaks)
        run: ~/.local/bin/gitleaks git --redact --no-banner --verbose
      - name: Neovim, tmux, vim and doctor
        run: scripts/ci-checks.sh
