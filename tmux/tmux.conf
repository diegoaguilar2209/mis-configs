# Team tmux config (tmux 3.4+). Prefix: Ctrl-a. Press prefix then ? to list every key.

# --- Basics -----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10          # no lag when pressing Esc in Neovim
set -g focus-events on          # Neovim reloads files changed outside (autoread)
set -g display-time 2000

# True color, undercurl and extended keys (Shift+Enter works in Claude Code)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,*:usstyle"
set -s extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on

# Clipboard: copies reach Windows through OSC 52 (Windows Terminal supports it)
set -s set-clipboard on

# --- Keys -------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Splits open in the current directory: | vertical, - horizontal
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode with vim keys: prefix [ , v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Projects: prefix f opens a fuzzy list of your projects and jumps to (or creates) its session
bind f display-popup -E -w 80% -h 60% "tmux-sessionizer"
# Claude Code in a side pane of the current project: prefix C
bind C split-window -h -l 45% -c "#{pane_current_path}" "claude"
# Lazygit in a popup: prefix g
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Ctrl-h/j/k/l moves between tmux panes and Neovim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l   # prefix Ctrl-l clears the screen

# --- Look (Tokyo Night) -----------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[fg=#e0af68]PREFIX ,}#[fg=#565f89]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"

# --- Plugins (installed by install.sh; prefix I installs, prefix U updates) --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix Ctrl-s save, prefix Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # saves every 15 min and restores on start
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.config/tmux/plugins/tpm/tpm'
