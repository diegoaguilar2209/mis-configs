# Fast, minimal prompt: directory, git, Python env, duration of slow commands.
add_newline = false
command_timeout = 500
format = "$directory$git_branch$git_status$python$cmd_duration$line_break$character"

[directory]
truncation_length = 3
style = "bold blue"

[git_branch]
format = "[$branch]($style) "
style = "purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"

[python]
format = "[${symbol}${virtualenv}]($style) "
symbol = "py "
style = "green"

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "dimmed white"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
